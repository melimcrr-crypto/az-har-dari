name: TTS best

on:
  workflow_dispatch:
    inputs:
      engines:
        description: 'pocketv2, f5, mossnano'
        required: true
        default: 'pocketv2'

permissions:
  contents: read

jobs:
  best:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: پایه
        run: |
          python -m pip install --upgrade pip
          python -m pip install imageio-ffmpeg soundfile

      - name: Pocket-TTS-Farsi v2
        if: contains(inputs.engines, 'pocketv2')
        continue-on-error: true
        env:
          HF_HOME: /home/runner/hf
        run: |
          python -m pip install "pocket-tts @ git+https://github.com/mallahyari/pocket-tts@main"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers
          cd /tmp && mkdir -p p2 && cd p2
          for f in normalize_fa.py model.yaml; do
            curl -sL -O "https://huggingface.co/mehdi-hf/pocket-tts-farsi-v2/resolve/main/$f"
          done
          curl -sL -O https://huggingface.co/mehdi-hf/pocket-tts-farsi-v2/resolve/main/samples/prompt_hello.wav
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=/tmp/p2 python shared/scripts/tts/pocket_v2.py out/pocketv2
          ls -la out/pocketv2 || true

      - name: F5-TTS فارسی (Apache-2.0)
        if: contains(inputs.engines, 'f5')
        continue-on-error: true
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install f5-tts || true
          git clone --depth 1 https://huggingface.co/Lumos675/F5_TTS_Persian /tmp/f5fa
          curl -sL -o /tmp/f5fa/ref.wav https://huggingface.co/mehdi-hf/pocket-tts-farsi-v2/resolve/main/samples/prompt_hello.wav
          mkdir -p out/f5
          python shared/scripts/tts/f5_persian.py out/f5
          ls -la out/f5 || true

      - name: MOSS-TTS-Nano
        if: contains(inputs.engines, 'mossnano')
        continue-on-error: true
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/OpenMOSS/MOSS-TTS-Nano.git /tmp/moss
          cd /tmp/moss
          python -m pip install -r requirements.txt || true
          python -m pip install git+https://github.com/WhizZest/WeTextProcessing.git || true
          python -m pip install -e . || true
          mkdir -p "$GITHUB_WORKSPACE/out/mossnano"
          python infer.py --prompt-audio-path assets/audio/zh_1.wav \
            --text "اینستاگرام از تو پول نمی‌گیره، ولی از هر ثانیه‌ای که توی فیدت می‌گذرونی پول درمی‌آره." || true
          cp generated_audio/*.wav "$GITHUB_WORKSPACE/out/mossnano/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/out/mossnano" || true

      - name: بسته‌بندی
        run: |
          mkdir -p small
          find out -type f \( -name "*.wav" -o -name "*.mp3" \) 2>/dev/null | while read f; do
            d=$(basename "$(dirname "$f")"); b=$(basename "$f")
            python -c "import sys,subprocess,imageio_ffmpeg as m; subprocess.run([m.get_ffmpeg_exe(),'-y','-loglevel','error','-i',sys.argv[1],'-ac','1','-c:a','libmp3lame','-b:a','128k',sys.argv[2]],check=True)" "$f" "small/$d-$b.mp3" || true
          done
          ls -la small

      - uses: actions/upload-artifact@v4
        with:
          name: tts-best
          path: small
          retention-days: 14
